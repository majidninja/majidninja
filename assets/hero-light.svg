<text x="28" y="120" font-size="15" xml:space="preserve"><tspan fill="#59636e">DevOps engineer · server master · security expert</tspan></text>
<text x="28" y="145" font-size="15" xml:space="preserve"><tspan fill="#59636e">Ramallah · majid.ninja</tspan></text>
<text x="28" y="170" font-size="15" xml:space="preserve"><tspan fill="#1a7f37" class="b">majid@ninja</tspan><tspan fill="#1f2328">:</tspan><tspan fill="#0969da" class="b">~</tspan><tspan fill="#1f2328">$ </tspan><tspan fill="#1f2328">systemctl status majid</tspan></text>
<text x="28" y="195" font-size="15" xml:space="preserve"><tspan fill="#1a7f37">● </tspan><tspan fill="#1f2328" class="b">majid.service</tspan><tspan fill="#59636e"> - keeps servers up and attackers out</tspan></text>
<text x="28" y="220" font-size="15" xml:space="preserve"><tspan fill="#59636e">     Active: </tspan><tspan fill="#1a7f37" class="b">active (running)</tspan><tspan fill="#59636e"> since 2023-08-31</tspan></text>
<text x="28" y="245" font-size="15" xml:space="preserve"><tspan fill="#59636e">      Tasks: </tspan><tspan fill="#1f2328">bash scripts, hardware, games</tspan></text>
<text x="28" y="270" font-size="15" xml:space="preserve"><tspan fill="#1a7f37" class="b">majid@ninja</tspan><tspan fill="#1f2328">:</tspan><tspan fill="#0969da" class="b">~</tspan><tspan fill="#1f2328">$ </tspan><tspan fill="#1f2328" class="cur">█</tspan></text>
